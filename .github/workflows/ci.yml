name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate frontmatter
        run: python scripts/validate_frontmatter.py
      - name: Check contracts
        run: python scripts/check_contracts.py
      - name: Run eval scaffold
        run: python tests/run_eval.py

  render-examples:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Render examples
        run: python scripts/render_examples.py
      - uses: actions/upload-artifact@v4
        with:
          name: skill-examples
          path: docs/examples-rendered/
